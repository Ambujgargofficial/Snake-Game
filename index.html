<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Mobile Viewport setting - very important -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Neon Snake</title>
    <style>
        /* --- Stylish Dark Theme & Typography --- */
        :root {
            --neon-green: #39ff14;
            --neon-red: #ff073a;
            --dark-bg: #111;
            --ui-bg: rgba(20, 20, 20, 0.95);
        }
        body {
            background-color: #111; /* Fallback */
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Courier New', Courier, monospace; /* Arcade style font */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            touch-action: none; /* Prevents scrolling on mobile */
            overflow: hidden;
        }

        h1 { 
            margin: 10px 0; 
            font-size: 28px; 
            text-shadow: 0 0 10px #39ff14;
            letter-spacing: 2px;
        }
        
        #score-board {
            font-size: 20px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* --- The Game Canvas --- */
        canvas {
            background-color: #000;
            /* Neon Glow Effect */
            border: 3px solid #39ff14;
            box-shadow: 0 0 20px #39ff14;
            border-radius: 5px;
            /* Responsive width for mobile */
            max-width: 95vw; 
            max-height: 60vh;
            image-rendering: pixelated; /* Makes visuals crisp */
        }

        /* --- Mobile D-Pad Controls --- */
        .controls-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            width: 100%;
            padding-bottom: 20px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 70px 70px 70px;
            grid-template-rows: 70px 70px;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(145deg, #333, #222);
            border: 2px solid #444;
            box-shadow: 0 4px #111;
            border-radius: 15px;
            color: #39ff14;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none; /* Prevents text selection on tap */
            transition: all 0.1s;
        }

        .btn:active { 
            box-shadow: 0 1px #111;
            transform: translateY(3px);
            background: #2a2a2a;
            color: white;
        }

        /* Positioning buttons */
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        /* --- Overlays (Start Menu & Game Over) --- */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 20, 20, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10; /* Ensure it's on top */
        }

        #game-over { display: none; } /* Hidden by default */

        .menu-box {
            background: rgba(0,0,0,0.8);
            border: 2px solid #39ff14;
            box-shadow: 0 0 30px #39ff14;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 80%;
            max-width: 350px;
        }

        h2.neon-text {
            color: white;
            text-shadow: 0 0 15px #ff073a;
            font-size: 32px;
            margin-top: 0;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 18px;
            font-family: inherit;
            font-weight: bold;
            color: #111;
            background: #39ff14;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px #39ff14;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .menu-btn.easy { background: #00d2ff; box-shadow: 0 0 10px #00d2ff; }
        .menu-btn.hard { background: #ff073a; box-shadow: 0 0 10px #ff073a; color: white;}

        .menu-btn:hover, .menu-btn:active {
            transform: scale(1.05);
            box-shadow: 0 0 25px currentColor;
        }

        #game-container {
            display: none; /* Hidden until difficulty selected */
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- START MENU SCREEN -->
    <div id="start-screen" class="overlay">
        <div class="menu-box">
            <h1>NEON SNAKE</h1>
            <p>Select Difficulty:</p>
            <button class="menu-btn easy" onclick="startGame('easy')">EASY (No Walls)</button>
            <button class="menu-btn" onclick="startGame('medium')">MEDIUM</button>
            <button class="menu-btn hard" onclick="startGame('hard')">HARD</button>
        </div>
    </div>

    <!-- MAIN GAME INTERFACE -->
    <div id="game-container">
        <h1>Neon Snake</h1>
        <div id="score-board">Score: <span id="score">0</span> | Level: <span id="level-display"></span></div>

        <canvas id="gameCanvas" width="320" height="320"></canvas>

        <!-- Mobile Controls -->
        <div class="controls-container">
            <div class="controls-grid">
                <!-- Used Touchstart for faster response on mobile than onclick -->
                <div class="btn btn-up" ontouchstart="changeDirection('UP'); event.preventDefault()" onmousedown="changeDirection('UP')">▲</div>
                <div class="btn btn-left" ontouchstart="changeDirection('LEFT'); event.preventDefault()" onmousedown="changeDirection('LEFT')">◀</div>
                <div class="btn btn-down" ontouchstart="changeDirection('DOWN'); event.preventDefault()" onmousedown="changeDirection('DOWN')">▼</div>
                <div class="btn btn-right" ontouchstart="changeDirection('RIGHT'); event.preventDefault()" onmousedown="changeDirection('RIGHT')">▶</div>
            </div>
        </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="game-over" class="overlay">
        <div class="menu-box" style="border-color: #ff073a; box-shadow: 0 0 30px #ff073a;">
            <h2 class="neon-text">GAME OVER</h2>
            <p style="font-size: 20px;">Final Score: <span id="final-score" style="color: #39ff14">0</span></p>
            <button class="menu-btn" onclick="showMainMenu()">MAIN MENU</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const levelEl = document.getElementById("level-display");
        const finalScoreEl = document.getElementById("final-score");
        const gameOverScreen = document.getElementById("game-over");
        const startScreen = document.getElementById("start-screen");
        const gameContainer = document.getElementById("game-container");

        // Canvas dimensions
        const canvasWidth = canvas.width;
        const canvasHeight = canvas.height;
        
        const box = 20; // Size of one square block
        
        // Game State Variables
        let score = 0;
        let snake = [];
        let food = {};
        let d = ""; // Direction
        let gameLoop;
        let currentSpeed = 100;
        let wallsAreActive = true;
        let isGameRunning = false;

        // Difficulty Settings Configuration
        const difficultySettings = {
            'easy': { speed: 160, walls: false, label: 'Easy' },
            'medium': { speed: 100, walls: true, label: 'Medium' },
            'hard': { speed: 60, walls: true, label: 'Hard' }
        };

        // --- Menu Functions ---

        // Called when a difficulty button is clicked
        function startGame(difficulty) {
            console.log("Game Starting: " + difficulty); // Debugging check
            const settings = difficultySettings[difficulty];
            currentSpeed = settings.speed;
            wallsAreActive = settings.walls;
            levelEl.innerText = settings.label;
            
            // Update UI
            startScreen.style.display = "none";
            gameOverScreen.style.display = "none";
            gameContainer.style.display = "flex";
            
            initGame();
        }

        // Called by Game Over screen to go back to start
        function showMainMenu() {
             gameOverScreen.style.display = "none";
             gameContainer.style.display = "none";
             startScreen.style.display = "flex";
        }


        // --- Core Game Logic ---

        function initGame() {
            snake = [];
            // Start in the middle
            snake[0] = { 
                x: Math.floor((canvasWidth / 2) / box) * box, 
                y: Math.floor((canvasHeight / 2) / box) * box 
            };
            score = 0;
            d = ""; // Start stationary
            scoreEl.innerText = score;
            isGameRunning = true;
            
            createFood();
            
            // Clear any existing loop before starting a new one
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(drawGameTick, currentSpeed);
        }

        function createFood() {
            // Generate random coordinates suitable for the grid
            food = {
                x: Math.floor(Math.random() * (canvasWidth / box)) * box,
                y: Math.floor(Math.random() * (canvasHeight / box)) * box
            };
            // Ensure food doesn't appear inside the snake body
            for(let i=0; i<snake.length; i++){
                if(food.x === snake[i].x && food.y === snake[i].y){
                    createFood(); // Try again if it spawned on snake
                    return;
                }
            }
        }

        // Input Handling (Keyboard)
        document.addEventListener("keydown", function(event) {
            if(!isGameRunning) return;
            let key = event.keyCode;
            if((key == 37 || key == 65) && d != "RIGHT") d = "LEFT";
            if((key == 38 || key == 87) && d != "DOWN") d = "UP";
            if((key == 39 || key == 68) && d != "LEFT") d = "RIGHT";
            if((key == 40 || key == 83) && d != "UP") d = "DOWN";
        });

        // Input Handling (Mobile Buttons)
        window.changeDirection = function(dir) { // Make global for HTML access
            if(!isGameRunning) return;
            if (dir === "LEFT" && d !== "RIGHT") d = "LEFT";
            if (dir === "UP" && d !== "DOWN") d = "UP";
            if (dir === "RIGHT" && d !== "LEFT") d = "RIGHT";
            if (dir === "DOWN" && d !== "UP") d = "DOWN";
        };


        // --- Main Game Loop (Draws everything repeatedly) ---
        function drawGameTick() {
            // 1. Clear background
            ctx.fillStyle = "#111"; // Dark background
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // Optional: Draw subtle grid lines for style
            drawGrid();

            // 2. Draw Food (Neon Red)
            drawFood();

            // 3. Calculate new Head Position
            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if(d == "LEFT") snakeX -= box;
            if(d == "UP") snakeY -= box;
            if(d == "RIGHT") snakeX += box;
            if(d == "DOWN") snakeY += box;

            // 4. Handle Wall Collision based on difficulty
            if (wallsAreActive) {
                // Hard/Medium Mode: Walls kill
                if (snakeX < 0 || snakeX >= canvasWidth || snakeY < 0 || snakeY >= canvasHeight) {
                    gameOver();
                    return; // Stop drawing this frame
                }
            } else {
                // Easy Mode: Wrap around screen
                if (snakeX < 0) snakeX = canvasWidth - box;
                if (snakeX >= canvasWidth) snakeX = 0;
                if (snakeY < 0) snakeY = canvasHeight - box;
                if (snakeY >= canvasHeight) snakeY = 0;
            }

            // Define new head position
            let newHead = { x: snakeX, y: snakeY };

            // 5. Check Self-Collision (Snake eats body)
            if (collision(newHead, snake)) {
                gameOver();
                return;
            }

            // 6. Draw Snake
            drawSnake();

            // 7. Eating Food Logic
            if(snakeX == food.x && snakeY == food.y) {
                score++;
                scoreEl.innerText = score;
                createFood();
                // Don't pop the tail, so snake grows
            } else if (d !== "") {
                // Only remove tail if moving and didn't eat
                snake.pop();
            }

            // Add new Head to the front of the array
            if(d !== "") {
                 snake.unshift(newHead);
            }
        }

        // Helper: Draw Grid lines
        function drawGrid() {
             ctx.strokeStyle = "#222";
             ctx.lineWidth = 0.5;
             for (let i = box; i < canvasWidth; i += box) {
                 ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvasHeight); ctx.stroke();
                 ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvasWidth, i); ctx.stroke();
             }
        }

        // Helper: Stylish Food Draw
        function drawFood() {
             // Glow effect
             ctx.shadowBlur = 15;
             ctx.shadowColor = "red";
             ctx.fillStyle = "#ff073a"; // Neon Red
             
             // Draw slightly smaller than box for look
             let padding = 2;
             ctx.fillRect(food.x + padding, food.y + padding, box - padding*2, box - padding*2);
             
             // Reset shadow for other elements
             ctx.shadowBlur = 0;
        }

        // Helper: Stylish Snake Draw
        function drawSnake() {
            for(let i = 0; i < snake.length; i++) {
                // Head color vs Body color
                let color = (i == 0) ? "#39ff14" : "#28b410"; 
                
                // Add glow only to the head
                if(i === 0) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#39ff14"; // FIXED: Replaced var() with hex code
                } else {
                     ctx.shadowBlur = 0;
                }

                ctx.fillStyle = color;
                // Draw snake segment with slight padding so they look distinct
                ctx.fillRect(snake[i].x + 1, snake[i].y + 1, box - 2, box - 2);
            }
             ctx.shadowBlur = 0; // Reset shadow at end
        }


        function collision(head, array) {
            // Start checking from i=1 because i=0 is the head itself
            for(let i = 1; i < array.length; i++) {
                if(head.x == array[i].x && head.y == array[i].y) {
                    return true;
                }
            }
            return false;
        }

        function gameOver() {
            clearInterval(gameLoop);
            isGameRunning = false;
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = "flex";
        }
    </script>
</body>
</html>
