<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Mobile Viewport setting - very important -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Neon Snake</title>
    <style>
        /* --- Stylish Dark Theme & Typography --- */
        :root {
            --neon-green: #39ff14;
            --neon-red: #ff073a;
            --neon-gold: #ffd700;
            --neon-blue: #00ffff;
            --dark-bg: #111;
            --ui-bg: rgba(20, 20, 20, 0.95);
        }
        body {
            background-color: #111; 
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            touch-action: none; 
            overflow: hidden;
        }

        h1 { 
            margin: 5px 0; 
            font-size: 28px; 
            text-shadow: 0 0 10px #39ff14;
            letter-spacing: 2px;
        }
        
        #score-board {
            font-size: 18px;
            margin-bottom: 5px;
            font-weight: bold;
            display: flex;
            gap: 15px;
        }

        /* --- The Game Canvas --- */
        canvas {
            background-color: #080808;
            border: 3px solid #333;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
            border-radius: 10px;
            max-width: 95vw; 
            max-height: 55vh; /* Adjusted for footer space */
        }

        /* --- Mobile D-Pad Controls --- */
        .controls-container {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            width: 100%;
            padding-bottom: 5px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 8px;
        }

        .btn {
            background: linear-gradient(145deg, #333, #222);
            border: 2px solid #444;
            box-shadow: 0 4px #111;
            border-radius: 12px;
            color: #39ff14;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s;
        }

        .btn:active { 
            box-shadow: 0 1px #111;
            transform: translateY(3px);
            background: #2a2a2a;
            color: white;
        }

        /* Positioning buttons */
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        /* --- Footer Credit Stylish --- */
        .creator-text {
            margin-top: 20px;
            font-size: 16px;
            font-family: 'Brush Script MT', cursive; /* Signature style font */
            background: linear-gradient(90deg, #00ffff, #39ff14);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.3);
            letter-spacing: 1px;
            opacity: 0.9;
            animation: pulse 3s infinite;
        }
        
        @keyframes pulse {
            0% { text-shadow: 0 0 5px rgba(57, 255, 20, 0.3); }
            50% { text-shadow: 0 0 15px rgba(0, 255, 255, 0.6); }
            100% { text-shadow: 0 0 5px rgba(57, 255, 20, 0.3); }
        }

        /* --- Overlays --- */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #game-over { display: none; }

        .menu-box {
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #39ff14;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.3);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            width: 85%;
            max-width: 320px;
        }

        h2.neon-text {
            color: white;
            text-shadow: 0 0 15px #ff073a;
            font-size: 32px;
            margin-top: 0;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            color: #111;
            background: #39ff14;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }
        
        /* Slider Styling */
        .speed-control {
            margin: 15px 0;
            background: #222;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        
        input[type=range] {
            width: 100%;
            margin-top: 10px;
            accent-color: #39ff14;
        }

        .legend {
            font-size: 12px;
            color: #aaa;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: flex-start;
            background: #222;
            padding: 10px;
            border-radius: 8px;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

        .menu-btn.easy { background: #00d2ff; box-shadow: 0 0 10px #00d2ff; }
        .menu-btn.hard { background: #ff073a; box-shadow: 0 0 10px #ff073a; color: white;}

        #game-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- START MENU SCREEN -->
    <div id="start-screen" class="overlay">
        <div class="menu-box">
            <h1 style="margin-top:0">SNAKE MASTER</h1>
            
            <!-- Speed Slider Section -->
            <div class="speed-control">
                <label style="color:#fff; font-size:14px;">Speed Level: <span id="speed-val" style="color:#39ff14; font-size:18px;">3</span></label>
                <br>
                <input type="range" min="1" max="5" value="3" id="speed-slider" oninput="updateSpeedLabel(this.value)">
                <div style="display:flex; justify-content:space-between; font-size:10px; color:#666; margin-top:2px;">
                    <span>Slow</span><span>Fast</span>
                </div>
            </div>

            <p style="margin:5px 0; font-size:14px; color:#ccc;">Select Mode:</p>
            
            <button class="menu-btn easy" onclick="startGame(false)">PLAY: NO WALLS</button>
            <button class="menu-btn hard" onclick="startGame(true)">PLAY: WITH WALLS</button>
            
            <div class="legend">
                <div class="legend-item"><span class="dot" style="background:#ff073a; box-shadow: 0 0 5px red;"></span> Red Apple: +1 Point</div>
                <div class="legend-item"><span class="dot" style="background:#ffd700; box-shadow: 0 0 5px gold;"></span> Gold Coin: +10 Points</div>
                <div class="legend-item"><span class="dot" style="background:#00ffff; box-shadow: 0 0 5px cyan;"></span> Magic Potion: Shrinks Snake</div>
            </div>
            
            <div class="creator-text">Created By : Ambuj Garg</div>
        </div>
    </div>

    <!-- MAIN GAME INTERFACE -->
    <div id="game-container">
        <div id="score-board">
            <span>Score: <span id="score" style="color:#39ff14">0</span></span>
            <span>High: <span id="high-score" style="color:#ffd700">0</span></span>
        </div>

        <canvas id="gameCanvas" width="320" height="320"></canvas>

        <!-- Mobile Controls -->
        <div class="controls-container">
            <div class="controls-grid">
                <div class="btn btn-up" ontouchstart="changeDirection('UP'); event.preventDefault()" onmousedown="changeDirection('UP')">▲</div>
                <div class="btn btn-left" ontouchstart="changeDirection('LEFT'); event.preventDefault()" onmousedown="changeDirection('LEFT')">◀</div>
                <div class="btn btn-down" ontouchstart="changeDirection('DOWN'); event.preventDefault()" onmousedown="changeDirection('DOWN')">▼</div>
                <div class="btn btn-right" ontouchstart="changeDirection('RIGHT'); event.preventDefault()" onmousedown="changeDirection('RIGHT')">▶</div>
            </div>
        </div>
        
        <!-- Removed Creator Text from here -->
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="game-over" class="overlay">
        <div class="menu-box" style="border-color: #ff073a; box-shadow: 0 0 30px #ff073a;">
            <h2 class="neon-text">GAME OVER</h2>
            <p style="font-size: 20px;">Score: <span id="final-score" style="color: #39ff14">0</span></p>
            <button class="menu-btn" onclick="showMainMenu()">MAIN MENU</button>
            <button class="menu-btn easy" onclick="restartSameLevel()">PLAY AGAIN</button>
            <div class="creator-text" style="margin-top:20px;">Created By : Ambuj Garg</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const highScoreEl = document.getElementById("high-score");
        const finalScoreEl = document.getElementById("final-score");
        const gameOverScreen = document.getElementById("game-over");
        const startScreen = document.getElementById("start-screen");
        const gameContainer = document.getElementById("game-container");

        const box = 20; 
        let canvasWidth = canvas.width;
        let canvasHeight = canvas.height;
        
        // Game State
        let snake = [];
        let score = 0;
        let highScore = 0;
        let d = ""; 
        let gameLoop;
        let wallsAreActive = true;
        let isGameRunning = false;
        let currentSpeed = 100;

        // Items
        let food = { x: 0, y: 0 };
        let bonusItem = { x: -100, y: -100, active: false, timer: 0 };
        let magicFruit = { x: -100, y: -100, active: false, timer: 0 };

        // Update label text when slider moves
        function updateSpeedLabel(val) {
            document.getElementById('speed-val').innerText = val;
        }

        function startGame(wallsMode) {
            wallsAreActive = wallsMode;
            
            // Get Speed from slider (1 to 5)
            let speedVal = parseInt(document.getElementById('speed-slider').value);
            
            // Map 1-5 to Milliseconds (Lower is faster)
            // Tweaked: Level 1 is now much slower (400ms)
            const speedMap = {
                1: 400, // Very Slow (Perfect for beginners)
                2: 250, // Slow
                3: 150, // Normal
                4: 90,  // Fast
                5: 50   // Super Fast
            };
            
            currentSpeed = speedMap[speedVal];
            
            startScreen.style.display = "none";
            gameOverScreen.style.display = "none";
            gameContainer.style.display = "flex";
            
            initGame();
        }

        function restartSameLevel() {
            // Just reuse current settings
            startScreen.style.display = "none";
            gameOverScreen.style.display = "none";
            gameContainer.style.display = "flex";
            initGame();
        }

        function showMainMenu() {
             gameOverScreen.style.display = "none";
             gameContainer.style.display = "none";
             startScreen.style.display = "flex";
        }

        function initGame() {
            snake = [];
            let startX = Math.floor((canvasWidth / 2) / box) * box;
            let startY = Math.floor((canvasHeight / 2) / box) * box;
            snake[0] = { x: startX, y: startY };
            snake[1] = { x: startX - box, y: startY };
            snake[2] = { x: startX - (box*2), y: startY };

            score = 0;
            d = "RIGHT"; 
            scoreEl.innerText = score;
            isGameRunning = true;
            
            createFood();
            resetBonus();
            resetMagic();
            
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(drawGameTick, currentSpeed);
        }

        // --- Spawning Logic ---

        function getRandomPos() {
            return {
                x: Math.floor(Math.random() * (canvasWidth / box)) * box,
                y: Math.floor(Math.random() * (canvasHeight / box)) * box
            };
        }

        function createFood() {
            food = getRandomPos();
            while(isOnSnake(food)) { food = getRandomPos(); }
        }

        function spawnBonus() {
            bonusItem = getRandomPos();
            while(isOnSnake(bonusItem) || (bonusItem.x === food.x && bonusItem.y === food.y)) { 
                bonusItem = getRandomPos(); 
            }
            bonusItem.active = true;
            bonusItem.timer = 50; 
        }

        function spawnMagic() {
            magicFruit = getRandomPos();
             while(isOnSnake(magicFruit) || (magicFruit.x === food.x && magicFruit.y === food.y)) { 
                magicFruit = getRandomPos(); 
            }
            magicFruit.active = true;
            magicFruit.timer = 80; 
        }

        function resetBonus() { bonusItem.active = false; bonusItem.x = -100; }
        function resetMagic() { magicFruit.active = false; magicFruit.x = -100; }

        function isOnSnake(pos) {
            for(let i=0; i<snake.length; i++){
                if(pos.x === snake[i].x && pos.y === snake[i].y) return true;
            }
            return false;
        }

        // --- Input ---
        document.addEventListener("keydown", function(event) {
            if(!isGameRunning) return;
            let key = event.keyCode;
            if((key == 37 || key == 65) && d != "RIGHT") d = "LEFT";
            if((key == 38 || key == 87) && d != "DOWN") d = "UP";
            if((key == 39 || key == 68) && d != "LEFT") d = "RIGHT";
            if((key == 40 || key == 83) && d != "UP") d = "DOWN";
        });

        window.changeDirection = function(dir) {
            if(!isGameRunning) return;
            if (dir === "LEFT" && d !== "RIGHT") d = "LEFT";
            if (dir === "UP" && d !== "DOWN") d = "UP";
            if (dir === "RIGHT" && d !== "LEFT") d = "RIGHT";
            if (dir === "DOWN" && d !== "UP") d = "DOWN";
        };

        // --- Drawing & Logic ---

        function drawGameTick() {
            // 1. Background
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            
            // Grid
            ctx.strokeStyle = "#222";
            ctx.lineWidth = 1;
            for (let i = box; i < canvasWidth; i += box) {
                 ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvasHeight); ctx.stroke();
            }
            for (let i = box; i < canvasHeight; i += box) {
                 ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvasWidth, i); ctx.stroke();
            }

            // 2. Game Logic
            if (!bonusItem.active && Math.random() < 0.01) spawnBonus();
            if (!magicFruit.active && Math.random() < 0.005) spawnMagic();

            if (bonusItem.active) {
                bonusItem.timer--;
                if(bonusItem.timer <= 0) resetBonus();
            }
            if (magicFruit.active) {
                magicFruit.timer--;
                if(magicFruit.timer <= 0) resetMagic();
            }

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if(d == "LEFT") snakeX -= box;
            if(d == "UP") snakeY -= box;
            if(d == "RIGHT") snakeX += box;
            if(d == "DOWN") snakeY += box;

            // Wall Collision
            if (wallsAreActive) {
                if (snakeX < 0 || snakeX >= canvasWidth || snakeY < 0 || snakeY >= canvasHeight) {
                    gameOver(); return;
                }
            } else {
                if (snakeX < 0) snakeX = canvasWidth - box;
                if (snakeX >= canvasWidth) snakeX = 0;
                if (snakeY < 0) snakeY = canvasHeight - box;
                if (snakeY >= canvasHeight) snakeY = 0;
            }

            let newHead = { x: snakeX, y: snakeY };

            if (collision(newHead, snake)) {
                gameOver(); return;
            }

            let ateFood = false;

            if(snakeX == food.x && snakeY == food.y) {
                score++;
                ateFood = true;
                createFood();
            }

            if(bonusItem.active && snakeX == bonusItem.x && snakeY == bonusItem.y) {
                score += 10;
                resetBonus();
            }

            if(magicFruit.active && snakeX == magicFruit.x && snakeY == magicFruit.y) {
                if(snake.length > 3) {
                    snake.pop();
                    snake.pop();
                }
                resetMagic();
            }

            if(!ateFood) {
                snake.pop();
            }

            scoreEl.innerText = score;
            if(score > highScore) {
                highScore = score;
                highScoreEl.innerText = highScore;
            }

            snake.unshift(newHead);

            // 3. Drawing
            drawOrb(food.x, food.y, "#ff073a", false);

            if(bonusItem.active) {
                let blink = (bonusItem.timer < 15 && bonusItem.timer % 4 == 0);
                if(!blink) drawOrb(bonusItem.x, bonusItem.y, "#ffd700", true);
            }

            if(magicFruit.active) {
                drawOrb(magicFruit.x, magicFruit.y, "#00ffff", true);
            }

            drawSnake();
        }

        function drawOrb(x, y, color, glow) {
            ctx.fillStyle = color;
            if(glow) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
            } else {
                ctx.shadowBlur = 0;
            }
            
            ctx.beginPath();
            ctx.arc(x + box/2, y + box/2, box/2 - 2, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawSnake() {
            for(let i = 0; i < snake.length; i++) {
                let x = snake[i].x;
                let y = snake[i].y;
                
                if(i == 0) {
                    ctx.fillStyle = "#39ff14"; 
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#39ff14";
                    
                    ctx.beginPath();
                    ctx.arc(x + box/2, y + box/2, box/2, 0, Math.PI*2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = "black";
                    let eyeOffsetX = 0, eyeOffsetY = 0;
                    if(d=="RIGHT") { eyeOffsetX = 5; eyeOffsetY = -3; }
                    if(d=="LEFT")  { eyeOffsetX = -5; eyeOffsetY = -3; }
                    if(d=="UP")    { eyeOffsetX = -3; eyeOffsetY = -5; }
                    if(d=="DOWN")  { eyeOffsetX = -3; eyeOffsetY = 5; }

                    ctx.beginPath();
                    ctx.arc(x + box/2 + eyeOffsetX, y + box/2 + eyeOffsetY, 2, 0, Math.PI*2);
                    ctx.fill();
                     if(d=="RIGHT" || d=="LEFT") {
                        ctx.beginPath(); ctx.arc(x + box/2 + eyeOffsetX, y + box/2 - eyeOffsetY, 2, 0, Math.PI*2); ctx.fill();
                     } else {
                        ctx.beginPath(); ctx.arc(x + box/2 - eyeOffsetX, y + box/2 + eyeOffsetY, 2, 0, Math.PI*2); ctx.fill();
                     }

                } else {
                    ctx.fillStyle = (i%2==0) ? "#2eb82e" : "#249624";
                    ctx.beginPath();
                    ctx.arc(x + box/2, y + box/2, box/2 - 1, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }

        function collision(head, array) {
            for(let i = 1; i < array.length; i++) {
                if(head.x == array[i].x && head.y == array[i].y) {
                    return true;
                }
            }
            return false;
        }

        function gameOver() {
            clearInterval(gameLoop);
            isGameRunning = false;
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = "flex";
        }
    </script>
</body>
</html>
